name: Win RDP + Tailscale + Startup Script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: pwsh
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Error "Secret 'RDP_PASSWORD' is empty or not set in Repository Secrets!"
              exit 1
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires | Out-Null
          } else {
              Set-LocalUser -Name "RDP" -Password $securePass
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "Failed to create RDP user."
              exit 1
          }
          Write-Host "User 'RDP' configured successfully."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-runner-${{ github.run_id }}

      - name: Get Tailscale IP & Verify RDP
        shell: pwsh
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = & $tsExe ip -4 2>$null
              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale IP: $tsIP"

          $testResult = Test-NetConnection -ComputerName $tsIP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }
          Write-Host "TCP connectivity on port 3389 successful!"

      - name: Maintain Connection & Watch RDP User
        shell: pwsh
        run: |
          Write-Host "`n=================================="
          Write-Host "           RDP ACCESS             "
          Write-Host "=================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: [Hidden in Secrets]"
          Write-Host "==================================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"
          $scriptExecuted = $false

          while ($true) {
              if (-not $scriptExecuted -and (Test-Path $rdpProfile)) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "[+] Downloads.bat saved to Startup folder."

                      Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$downloadPath`"" -WorkingDirectory $startupPath
                      Write-Host "[+] Downloads.bat executed successfully."
                      $scriptExecuted = $true
                  }
                  catch {
                      Write-Host "[-] Error copying or executing Downloads.bat: $($_.Exception.Message)"
                      $scriptExecuted = $true
                  }
              }
              elseif (-not $scriptExecuted) {
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Waiting for user 'RDP' to log in and create profile..."
              }
              else {
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP Active - Cancel workflow to terminate."
              }

              Start-Sleep -Seconds 30
          }
